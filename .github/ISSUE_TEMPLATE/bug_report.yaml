name: Bug Report
description: Report a problem installing or running OCI CLI through asdf
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the commands you ran and the relevant error output.
      placeholder: |
        asdf install oci 3.93.0
        oci --version
    validations:
      required: true
  - type: input
    id: asdf-version
    attributes:
      label: asdf version
      description: Run `asdf --version`.
      placeholder: v0.20.0
    validations:
      required: true
  - type: input
    id: asdf-oci-revision
    attributes:
      label: asdf-oci plugin revision
      description: Copy the OCI plugin line from `asdf info`, including the repository URL and commit.
    validations:
      required: true
  - type: input
    id: oci-version
    attributes:
      label: OCI CLI version
      description: Run `oci --version`, or enter the release you tried to install if installation failed.
      placeholder: 3.93.0
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Run `python3 -VV` in the directory where installation failed.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu x86_64 or macOS arm64
    validations:
      required: true
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Include relevant environment settings or local plugin changes. Remove credentials and API keys from logs.
